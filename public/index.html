    <link href="https://fonts.googleapis.com/css2?family=Kosugi+Maru&family=Mandali&display=swap" rel="stylesheet">

    <!-- External Libs -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-FQSKNGBJ7W"></script>

      OneSignalDeferred.push(async function(OneSignal) {
        await OneSignal.init({
          appId: "049fc06c-108f-4836-8c2d-9c07ecbfd7fd",
          safari_web_id: "web.onesignal.auto.05605657-a1ec-46ab-8d61-441038586900",
          notifyButton: {
            enable: true,
          },
        });
      });

</head>
<body class="h-full overflow-hidden">
    <div id="app" class="bg-background h-screen flex flex-col transition-colors duration-300">
        <!-- Auth View -->
        <div id="auth-view" class="hidden flex flex-col items-center justify-center min-h-screen p-8 bg-background">
            <div class="timer-card text-center p-8 rounded-2xl shadow-lg max-w-sm w-full border border-muted">
                <h2 class="text-2xl font-bold mb-2">Welcome!</h2>
                <p class="mb-8 text-muted-foreground text-sm">利用するにはログインしてください</p>
                <button id="discord-login" class="w-full py-4 rounded-xl text-lg font-bold bg-[#5865F2] text-white shadow-md transition-all active:scale-95">
                    Discord Login
                </button>
            </div>
        </div>

        <!-- Main App View -->
        <div id="main-view" class="hidden h-full flex flex-col">
            <header id="app-header" class="fixed top-0 left-0 right-0 z-50 bg-background/80 backdrop-blur-md border-b h-16 flex items-center justify-between px-4">
                <div class="flex items-center gap-2">
                    <img src="/icon.png" alt="Logo" class="w-8 h-8">
                    <span class="font-bold text-lg">Cafe Timer</span>
                </div>
                <button id="menu-toggle" class="p-2 hover:bg-muted rounded-full">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                </button>
            </header>

            <main id="tab-content" class="flex-1 overflow-y-auto pt-16 pb-16">
                <!-- Component Content will be injected here -->
            </main>

            <nav id="bottom-nav" class="fixed bottom-0 left-0 right-0 bg-background/80 backdrop-blur-md border-t h-16 flex items-stretch justify-around px-2 z-40">
                <button data-tab="timer" class="btn-nav flex-1">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                    <span class="text-[10px] mt-1">Timer</span>
                </button>
                <button data-tab="history" class="btn-nav flex-1">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                    <span class="text-[10px] mt-1">History</span>
                </button>
                <button data-tab="bond" class="btn-nav flex-1">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l8.84-8.84 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
                    <span class="text-[10px] mt-1">Bond</span>
                </button>
            </nav>
        </div>

        <!-- Side Panel -->
        <div id="side-panel" class="fixed inset-0 z-[100] hidden">
            <div id="side-panel-backdrop" class="absolute inset-0 bg-black/50"></div>
            <div id="side-panel-content" class="absolute right-0 top-0 h-full w-64 bg-background shadow-xl transform translate-x-full transition-transform duration-300">
                <div class="p-6">
                    <h2 class="text-xl font-bold mb-4">Settings</h2>
                    <button id="logout-btn" class="w-full text-left py-2 px-4 hover:bg-muted rounded">Logout</button>
                </div>
            </div>
        </div>

        <div id="loading-overlay" class="fixed inset-0 z-[200] flex items-center justify-center bg-background">
            <div class="font-bold text-xl animate-pulse">Loading...</div>
        </div>
    </div>

    <script src="/script.js"></script>
</body>
</html>
